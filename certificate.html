<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهادة صحية</title>   <!-- ← يُستبدل تلقائياً حسب بيانات الشهادة -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f4f6f8;
    color: #333;
    direction: rtl;
  }

  /* ===== الشريط العلوي ===== */
  .top-bar {
    background: #fff;
    border-bottom: 1px solid #ddd;
    font-size: 12px;
    color: #666;
    padding: 6px 40px;
  }

  /* ===== الهيدر ===== */
  header {
    background: #fff;
    padding: 15px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #eee;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    color: #1a7f5a;
    font-size: 20px;
  }
  .logo-icon {
    width: 45px; height: 45px;
    background: #1a7f5a;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px;
  }

  /* ===== العنوان الرئيسي ===== */
  .page-title {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #333;
    margin: 35px 0 25px;
  }

  /* ===== صورة صاحب الشهادة ===== */
  .photo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 35px;
  }
  .photo-box {
    width: 180px; height: 180px;
    background: #e9ecef;
    border: 1px solid #ccc;
    overflow: hidden;
  }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== الحقول (صفين) ===== */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;   /* ← عمودين */
    gap: 40px;
    margin-bottom: 25px;
  }
  .field label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
    color: #333;
  }
  .field .value {
    background: #e9ecef;
    border: 1px solid #d0d5da;
    border-radius: 4px;
    padding: 14px 18px;
    font-size: 14px;
    color: #333;
    min-height: 48px;
    text-align: center;
  }

  /* ===== الأزرار ===== */
  .actions { text-align: center; margin: 30px 0; }
  .btn {
    display: inline-block;
    padding: 12px 30px;
    background: #1a7f5a;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    margin: 0 8px;
    border: none;
    cursor: pointer;
    font-size: 15px;
  }
  .btn:hover { background: #145c42; }

  /* ===== الفوتر ===== */
  footer {
    background: #1a5f47;
    color: #fff;
    padding: 30px;
    text-align: center;
    font-size: 13px;
  }

  /* ===== الطباعة ===== */
  @media print {
    .actions, footer, header, .top-bar { display: none; }
    body { background: #fff; }
  }

  /* ===== الجوال ===== */
  @media (max-width: 700px) {
    .row { grid-template-columns: 1fr; gap: 15px; }
    .page-title { font-size: 24px; }
  }
</style>
</head>
<body>

  <div class="top-bar">موقع تجريبي للأغراض التعليمية — لا يمثل أي جهة رسمية</div>

  <header>
    <div class="logo">
      <div class="logo-icon">&#9752;</div>
      <div>منصة<br><small style="font-size:11px; color:#666; font-weight:normal;">Services Platform</small></div>
    </div>
  </header>

  <h1 class="page-title">شهادة صحية</h1>

  <div class="photo-wrapper">
    <div class="photo-box"><img id="photo" src="" alt="صورة"></div>
  </div>

  <div class="container">
    <div class="row">
      <div class="field"><label>الأمانة</label><div class="value" id="f-secretariat"></div></div>
      <div class="field"><label>البلدية</label><div class="value" id="f-municipality"></div></div>
    </div>

    <div class="row">
      <div class="field"><label>الاسم</label><div class="value" id="f-name"></div></div>
      <div class="field"><label>رقم الإقامة</label><div class="value" id="f-residence"></div></div>
    </div>

    <div class="row">
      <div class="field"><label>الجنس</label><div class="value" id="f-gender"></div></div>
      <div class="field"><label>الجنسية</label><div class="value" id="f-nationality"></div></div>
    </div>

    <div class="row">
      <div class="field"><label>رقم الشهادة الصحية</label><div class="value" id="f-certnum"></div></div>
      <div class="field"><label>المهنة</label><div class="value" id="f-job"></div></div>
    </div>

    <div class="row">
      <div class="field"><label>تاريخ إصدار الشهادة الصحية هجري</label><div class="value" id="f-issueh"></div></div>
      <div class="field"><label>تاريخ إصدار الشهادة الصحية ميلادي</label><div class="value" id="f-issueg"></div></div>
    </div>

    <div class="row">
      <div class="field"><label>تاريخ نهاية الشهادة الصحية هجري</label><div class="value" id="f-expiryh"></div></div>
      <div class="field"><label>تاريخ نهاية الشهادة الصحية ميلادي</label><div class="value" id="f-expiryg"></div></div>
    </div>

    <div class="row">
      <div class="field"><label>نوع البرنامج التفتيشي</label><div class="value" id="f-inspection"></div></div>
      <div class="field"><label>تاريخ انتهاء البرنامج التفتيشي</label><div class="value" id="f-inspectionend"></div></div>
    </div>

    <div class="row">
      <div class="field"><label>رقم الرخصة</label><div class="value" id="f-license"></div></div>
      <div class="field"><label>اسم المنشأة</label><div class="value" id="f-facilityname"></div></div>
    </div>

    <div class="row">
      <div class="field"><label>رقم المنشأة</label><div class="value" id="f-facilitynum"></div></div>
      <div class="field"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
  </div>

  <footer>
    جميع الحقوق محفوظة © 2026 — منصة تجريبية للأغراض التعليمية فقط
  </footer>

  <script src="data.js"></script>
  <script>
    // قراءة رقم الشهادة من الرابط (?id=1)
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || '1';

    const cert = certificates.find(c => c.id === id);

    if (!cert) {
      document.querySelector('.container').innerHTML =
        '<p style="text-align:center;font-size:20px;padding:40px;">⚠️ الشهادة غير موجودة</p>';
    } else {
      // ✅ تغيير عنوان المتصفح تلقائياً
      document.title = cert.title || ('شهادة صحية - ' + cert.name);

      document.getElementById('photo').src = cert.photo;

      document.getElementById('f-secretariat').textContent = cert.secretariat;
      document.getElementById('f-municipality').textContent = cert.municipality;
      document.getElementById('f-name').textContent = cert.name;
      document.getElementById('f-residence').textContent = cert.residenceNumber;
      document.getElementById('f-gender').textContent = cert.gender;
      document.getElementById('f-nationality').textContent = cert.nationality;
      document.getElementById('f-certnum').textContent = cert.certificateNumber;
      document.getElementById('f-job').textContent = cert.job;
      document.getElementById('f-issueh').textContent = cert.issueDateHijri;
      document.getElementById('f-issueg').textContent = cert.issueDateGregorian;
      document.getElementById('f-expiryh').textContent = cert.expiryDateHijri;
      document.getElementById('f-expiryg').textContent = cert.expiryDateGregorian;
      document.getElementById('f-inspection').textContent = cert.inspectionType;
      document.getElementById('f-inspectionend').textContent = cert.inspectionEndHijri;
      document.getElementById('f-license').textContent = cert.licenseNumber || '—';
      document.getElementById('f-facilityname').textContent = cert.facilityName || '—';
      document.getElementById('f-facilitynum').textContent = cert.facilityNumber || '—';
    }
  </script>

</body>
</html>
