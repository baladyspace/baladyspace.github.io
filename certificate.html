<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهادة صحية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f4f6f8; color: #333; direction: rtl; }

  .top-bar { background: #fff; border-bottom: 1px solid #ddd; font-size: 12px; color: #666; padding: 6px 40px; }
  header { background: #fff; padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; color: #1a7f5a; font-size: 20px; }
  .logo-icon { width: 45px; height: 45px; background: #1a7f5a; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; }

  .page-title { text-align: center; font-size: 32px; font-weight: bold; margin: 35px 0 25px; }

  .photo-wrapper { display: flex; justify-content: center; margin-bottom: 35px; }
  .photo-box { width: 180px; height: 180px; background: #e9ecef; border: 1px solid #ccc; overflow: hidden; }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 25px; }
  .field label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
  .field .value { background: #e9ecef; border: 1px solid #d0d5da; border-radius: 4px; padding: 14px 18px; font-size: 14px; min-height: 48px; text-align: center; }

  .actions { text-align: center; margin: 30px 0; }
  .btn { display: inline-block; padding: 12px 30px; background: #1a7f5a; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; margin: 0 8px; border: none; cursor: pointer; font-size: 15px; }
  .btn:hover { background: #145c42; }

  footer { background: #1a5f47; color: #fff; padding: 30px; text-align: center; font-size: 13px; }
  footer p { margin-top: 10px; opacity: 0.9; }

  @media print {
    .actions, footer, header, .top-bar { display: none; }
    body { background: #fff; }
  }
  @media (max-width: 700px) {
    .row { grid-template-columns: 1fr; gap: 15px; }
  }
</style>
</head>
<body>

  <div class="top-bar">موقع تجريبي للأغراض التعليمية — لا يمثل أي جهة رسمية</div>

  <header>
    <div class="logo">
      <div class="logo-icon">&#9752;</div>
      <div>منصة<br><small style="font-size:11px; color:#666; font-weight:normal;">Services Platform</small></div>
    </div>
    <a href="index.html" class="btn" style="padding:8px 20px;">← رجوع للقائمة</a>
  </header>

  <h1 class="page-title">شهادة صحية</h1>

  <div class="photo-wrapper">
    <div class="photo-box"><img id="photo" src="" alt="صورة"></div>
  </div>

  <div class="container" id="fields"></div>

  <div class="actions">
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
  </div>

  <footer>
    <p>جميع الحقوق محفوظة © 2026 — منصة تجريبية للأغراض التعليمية فقط</p>
  </footer>

  <script src="data.js"></script>
  <script>
    // قراءة رقم الشهادة من الرابط (?id=1)
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || '1';

    const cert = certificates.find(c => c.id === id);

    if (!cert) {
      document.getElementById('fields').innerHTML =
        '<p style="text-align:center;font-size:18px;">⚠️ الشهادة غير موجودة</p>';
    } else {
      document.getElementById('photo').src = cert.photo;
      document.title = 'شهادة صحية - ' + cert.name;

      const fields = [
        ['الأمانة', cert.secretariat],
        ['البلدية', cert.municipality],
        ['الاسم', cert.name],
        ['رقم الإقامة', cert.residenceNumber],
        ['الجنس', cert.gender],
        ['الجنسية', cert.nationality],
        ['رقم الشهادة الصحية', cert.certificateNumber],
        ['المهنة', cert.job],
        ['تاريخ إصدار الشهادة الصحية هجري', cert.issueDateHijri],
        ['تاريخ إصدار الشهادة الصحية ميلادي', cert.issueDateGregorian],
        ['تاريخ نهاية الشهادة الصحية هجري', cert.expiryDateHijri],
        ['تاريخ نهاية الشهادة الصحية ميلادي', cert.expiryDateGregorian],
        ['نوع البرنامج التفتيشي', cert.inspectionType],
        ['تاريخ انتهاء البرنامج التفتيشي', cert.inspectionEndHijri],
        ['رقم الرخصة', cert.licenseNumber || '—'],
        ['اسم المنشأة', cert.facilityName || '—'],
        ['رقم المنشأة', cert.facilityNumber || '—']
      ];

      document.getElementById('fields').innerHTML = fields.map(f => `
        <div class="row">
          <div class="field"><label>${f[0]}</label><div class="value">${f[1]}</div></div>
        </div>
      `).join('');
    }
  </script>

</body>
</html>
