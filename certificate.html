<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهادة صحية</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #fff;
    color: #333;
    direction: rtl;
    padding: 30px 15px 60px;
  }

  /* ===== العنوان الرئيسي ===== */
  .page-title {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    color: #2c3e50;
    margin: 20px 0 40px;
    letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  /* ===== صورة الموظف ===== */
  .photo-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 40px;
  }
  .photo-box {
    width: 160px;
    height: 210px;
    background: #f5f5f5;
    border: 1px solid #ddd;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-box .placeholder {
    color: #bbb;
    font-size: 70px;
    user-select: none;
  }

  /* ===== الحقول ===== */
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-bottom: 22px;
  }
  .field label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    color: #333;
    margin-bottom: 8px;
    text-align: right;
  }
  .field .value {
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: 14px 18px;
    font-size: 15px;
    color: #555;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  /* ===== الأزرار ===== */
  .actions { text-align: center; margin: 50px 0 20px; }
  .btn {
    display: inline-block;
    padding: 12px 35px;
    background: #1a7f5a;
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    font-size: 15px;
    margin: 0 6px;
  }
  .btn:hover { background: #145c42; }

  /* ===== خطأ ===== */
  .error-box {
    text-align: center;
    padding: 80px 20px;
    font-size: 20px;
    color: #c0392b;
  }

  /* ===== الطباعة ===== */
  @media print {
    .actions { display: none; }
    body { padding: 10px; background: #fff; }
    .value { background: #f5f5f5 !important; }
  }

  /* ===== الجوال ===== */
  @media (max-width: 700px) {
    .row { grid-template-columns: 1fr; gap: 15px; }
    .page-title { font-size: 26px; }
  }
</style>
</head>
<body>

  <div id="mainContent" style="display:none;">

    <h1 class="page-title">شهادة صحية</h1>

    <!-- 📸 صورة الموظف -->
    <div class="photo-wrapper">
      <div class="photo-box">
        <img id="photo" src="" alt="صورة الموظف"
             onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=\'placeholder\'>👤</span>';">
      </div>
    </div>

    <!-- الحقول -->
    <div class="container">

      <div class="row">
        <div class="field">
          <label>الأمانة</label>
          <div class="value" id="f-secretariat"></div>
        </div>
        <div class="field">
          <label>البلدية</label>
          <div class="value" id="f-municipality"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>الاسم</label>
          <div class="value" id="f-name"></div>
        </div>
        <div class="field">
          <label>رقم الإقامة</label>
          <div class="value" id="f-residence"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>الجنس</label>
          <div class="value" id="f-gender"></div>
        </div>
        <div class="field">
          <label>الجنسية</label>
          <div class="value" id="f-nationality"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>رقم الشهادة الصحية</label>
          <div class="value" id="f-certnum"></div>
        </div>
        <div class="field">
          <label>المهنة</label>
          <div class="value" id="f-job"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>تاريخ إصدار الشهادة الصحية هجري</label>
          <div class="value" id="f-issueh"></div>
        </div>
        <div class="field">
          <label>تاريخ إصدار الشهادة الصحية ميلادي</label>
          <div class="value" id="f-issueg"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>تاريخ نهاية الشهادة الصحية هجري</label>
          <div class="value" id="f-expiryh"></div>
        </div>
        <div class="field">
          <label>تاريخ نهاية الشهادة الصحية ميلادي</label>
          <div class="value" id="f-expiryg"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>نوع البرنامج التفتيشي</label>
          <div class="value" id="f-inspection"></div>
        </div>
        <div class="field">
          <label>تاريخ انتهاء البرنامج التفتيشي</label>
          <div class="value" id="f-inspectionend"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>رقم الرخصة</label>
          <div class="value" id="f-license"></div>
        </div>
        <div class="field">
          <label>اسم المنشأة</label>
          <div class="value" id="f-facilityname"></div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>رقم المنشأة</label>
          <div class="value" id="f-facilitynum"></div>
        </div>
        <div class="field"></div>
      </div>

    </div>

    <div class="actions">
      <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    </div>

  </div>

  <div id="errorContent" class="error-box" style="display:none;">
    ⚠️ الشهادة غير موجودة — تحقق من رقم الشهادة في الرابط
  </div>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const certId = params.get('id');
    const cert = certificates.find(c => c.id === certId);

    if (!cert) {
      document.getElementById('errorContent').style.display = 'block';
    } else {
      document.getElementById('mainContent').style.display = 'block';
      document.title = cert.title || ('شهادة صحية - ' + cert.name);

      // 📸 صورة الموظف
      document.getElementById('photo').src = cert.photo;

      // تعبئة الحقول
      document.getElementById('f-secretariat').textContent = cert.secretariat;
      document.getElementById('f-municipality').textContent = cert.municipality;
      document.getElementById('f-name').textContent = cert.name;
      document.getElementById('f-residence').textContent = cert.residenceNumber;
      document.getElementById('f-gender').textContent = cert.gender;
      document.getElementById('f-nationality').textContent = cert.nationality;
      document.getElementById('f-certnum').textContent = cert.certificateNumber;
      document.getElementById('f-job').textContent = cert.job;
      document.getElementById('f-issueh').textContent = cert.issueDateHijri;
      document.getElementById('f-issueg').textContent = cert.issueDateGregorian;
      document.getElementById('f-expiryh').textContent = cert.expiryDateHijri;
      document.getElementById('f-expiryg').textContent = cert.expiryDateGregorian;
      document.getElementById('f-inspection').textContent = cert.inspectionType;
      document.getElementById('f-inspectionend').textContent = cert.inspectionEndHijri;
      document.getElementById('f-license').textContent = cert.licenseNumber || '';
      document.getElementById('f-facilityname').textContent = cert.facilityName || '';
      document.getElementById('f-facilitynum').textContent = cert.facilityNumber || '';
    }
  </script>

</body>
</html>
