<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روابط الشهادات</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f4f6f8;
    direction: rtl;
    color: #333;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .container { max-width: 1050px; margin: 0 auto; }
  h1 { color: #1a7f5a; font-size: 28px; margin-bottom: 8px; text-align: center; }
  .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 35px; }
  .count-badge {
    display: inline-block;
    background: #1a7f5a;
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    margin-right: 8px;
  }
  .link-item {
    background: #fff;
    padding: 18px 22px;
    margin-bottom: 14px;
    border-radius: 10px;
    border-right: 5px solid #1a7f5a;
    display: grid;
    grid-template-columns: 220px 1fr auto auto;
    align-items: center;
    gap: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .link-item:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
  .link-info { min-width: 0; }
  .link-info strong {
    color: #1a7f5a;
    display: block;
    font-size: 15px;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .link-info small { color: #888; font-size: 12px; }
  .link-url {
    background: #f0f2f5;
    padding: 10px 14px;
    border-radius: 5px;
    font-size: 12px;
    color: #333;
    direction: ltr;
    text-align: left;
    overflow-x: auto;
    white-space: nowrap;
    font-family: Consolas, 'Courier New', monospace;
    min-width: 0;
  }
  .btn {
    background: #1a7f5a;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn:hover { background: #145c42; }
  .btn.copied { background: #27ae60; }
  .open-btn {
    background: #fff;
    color: #1a7f5a;
    border: 1px solid #1a7f5a;
    padding: 10px 16px;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
  }
  .open-btn:hover { background: #f0fdf9; }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 18px;
    background: #fff;
    border-radius: 10px;
  }
  .top-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }
  .top-actions .btn { padding: 12px 24px; font-size: 14px; }
  @media (max-width: 850px) {
    .link-item { grid-template-columns: 1fr; gap: 10px; }
    .link-url { font-size: 11px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>📋 روابط الشهادات</h1>
  <p class="subtitle">
    <span class="count-badge" id="count">0</span>
    اضغط "نسخ" لنسخ أي رابط ومشاركته
  </p>

  <div class="top-actions">
    <button class="btn" onclick="copyAll()">📋 نسخ كل الروابط</button>
    <button class="btn" onclick="downloadAll()">💾 تحميل كملف نصي</button>
  </div>

  <div id="list"></div>
</div>

<script src="data.js"></script>
<script>
  // ✅ بناء الرابط من نفس مجلد هذه الصفحة (يعمل من أي مسار)
  const base = window.location.origin + window.location.pathname.replace('links.html', 'certificate.html?id=');

  const list = document.getElementById('list');
  const countEl = document.getElementById('count');

  if (typeof certificates === 'undefined' || certificates.length === 0) {
    list.innerHTML = '<div class="empty">⚠️ لا توجد شهادات — تحقق من ملف data.js</div>';
    countEl.textContent = '0';
  } else {
    countEl.textContent = certificates.length;
    list.innerHTML = certificates.map((c, i) => {
      const url = base + c.id;
      return `
        <div class="link-item">
          <div class="link-info">
            <strong>${i + 1}. ${c.name}</strong>
            <small>رقم الشهادة: ${c.certificateNumber}</small>
          </div>
          <code class="link-url">${url}</code>
          <a href="${url}" target="_blank" class="open-btn">🔗 فتح</a>
          <button class="btn" onclick="copyLink('${url}', this)">📋 نسخ</button>
        </div>
      `;
    }).join('');
  }

  function copyLink(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
      const old = btn.textContent;
      btn.textContent = "✅ تم النسخ";
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1500);
    });
  }

  function copyAll() {
    if (typeof certificates === 'undefined' || !certificates.length) return;
    const all = certificates.map(c => base + c.id).join('\n');
    navigator.clipboard.writeText(all).then(() => {
      alert('✅ تم نسخ ' + certificates.length + ' روابط');
    });
  }

  function downloadAll() {
    if (typeof certificates === 'undefined' || !certificates.length) return;
    const all = certificates.map((c, i) =>
      `${i + 1}. ${c.name}\nرقم: ${c.certificateNumber}\n${base + c.id}\n`
    ).join('\n-------------------------------------\n\n');
    const blob = new Blob([all], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'certificate-links.txt';
    link.click();
  }
</script>

</body>
</html>
